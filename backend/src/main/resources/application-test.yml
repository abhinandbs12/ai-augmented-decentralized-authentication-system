# Integration tests: Neon "test" branch, random port, WalletRegistryClient mocked.
# (Tests tagged "blockchain" are separate: they read the chain settings from .env.local and need a Hardhat node.)
spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

# Values the tests assert on are pinned here so that a developer's .env.local cannot change the outcome.
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: false

blockauth:
  app-origin: http://localhost:5173
  challenge-ttl-seconds: 120
  blockchain:
    rpc-url: http://127.0.0.1:8545
    chain-id: 31337
    contract-address: "0x0000000000000000000000000000000000000001"
    # operator-private-key is generated by IntegrationTest; nothing is ever signed with it.
  security:
    trusted-device-days: 30
    admin-action-delay: 10m
  # Due administrator actions are carried out by the tests themselves, never by the background job.
  admin-actions:
    schedule: "-"
