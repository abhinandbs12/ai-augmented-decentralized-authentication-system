# Docker Compose — AI-Augmented Decentralized Auth System
# Phase 1 integration: Gateway, Orchestrator, Risk Engine, MongoDB, PostgreSQL, Hardhat node.
#
# Only the gateway and the Hardhat RPC port are published to the host (TRD §13.2, SR-10).
# For direct access to the internal services while developing, add docker-compose.dev.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # --- Blockchain (Karthik) ---
  hardhat:
    build: ./contracts
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8545',{method:'POST',headers:{'Content-Type':'application/json'},body:'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\"}'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Deploys AuthRegistry once the chain is up and writes the address to the
  # shared volume, so no address has to be copied by hand (TRD 10.3).
  contract-deploy:
    build: ./contracts
    command: ["npx", "hardhat", "run", "scripts/deploy.ts", "--network", "localhost"]
    environment:
      RPC_URL: http://hardhat:8545
      CONTRACT_ADDRESS_FILE: /shared/contract-address.txt
    volumes:
      - chain-state:/shared
    restart: "no"
    depends_on:
      hardhat:
        condition: service_healthy

  # --- Backend Services ---
  gateway:
    build: ./services/gateway
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:3001
    depends_on:
      orchestrator:
        condition: service_healthy

  orchestrator:
    build: ./services/orchestrator
    env_file: .env
    environment:
      RISK_ENGINE_URL: http://risk-engine:8001
      DATABASE_URL: postgres://authuser:authpass@postgres:5432/authdb
      MONGO_URL: mongodb://mongo:27017
      RPC_URL: http://hardhat:8545
      CONTRACT_ADDRESS_FILE: /shared/contract-address.txt
    volumes:
      - chain-state:/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      risk-engine:
        condition: service_healthy
      contract-deploy:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  risk-engine:
    build: ./services/risk-engine
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      SCORER: rules
      VELOCITY_THRESHOLD: "5"
      VELOCITY_WINDOW_SECONDS: "300"
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Data Stores ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7

volumes:
  chain-state:
