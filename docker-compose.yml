# Docker Compose — AI-Augmented Decentralized Auth System
# Phase 1 integration: Gateway, Orchestrator, Risk Engine, MongoDB, PostgreSQL, Hardhat node.

version: "3.9"

services:
  # --- Blockchain (Karthik) ---
  hardhat:
    build: ./contracts
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8545"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Backend Services ---
  gateway:
    build: ./services/gateway
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:3001
    depends_on:
      orchestrator:
        condition: service_healthy

  orchestrator:
    build: ./services/orchestrator
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      RISK_ENGINE_URL: http://risk-engine:8001
      DATABASE_URL: postgres://authuser:authpass@postgres:5432/authdb
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      risk-engine:
        condition: service_healthy
      hardhat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  risk-engine:
    build: ./services/risk-engine
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      SCORER: rules
      VELOCITY_THRESHOLD: "5"
      VELOCITY_WINDOW_SECONDS: "300"
    depends_on:
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Data Stores ---
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
