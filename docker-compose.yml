# Optional local stack (the primary workflow runs without Docker). The database stays on Neon.
name: blockauth

services:
  hardhat:
    build: ./contracts
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    # Published on this machine only. The node's accounts are public test keys, and account #0 is the
    # contract admin: anyone who can reach port 8545 can change the registry.
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://127.0.0.1:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env.local
    environment:
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      APP_ORIGIN: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      hardhat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
